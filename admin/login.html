<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Admin Login — TravelSphere</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#0f172a,#0f766e);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:#fff;border-radius:24px;padding:48px 40px;width:100%;max-width:420px;box-shadow:0 30px 80px rgba(0,0,0,0.3)}
    .logo{display:flex;align-items:center;gap:10px;margin-bottom:32px;justify-content:center}
    .logo-icon{width:44px;height:44px;background:linear-gradient(135deg,#0f766e,#f59e0b);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px}
    .logo-text{font-size:1.3rem;font-weight:800;color:#0f172a}.logo-text span{color:#f59e0b}
    h2{font-size:1.4rem;font-weight:800;color:#0f172a;margin-bottom:4px}
    .sub{font-size:0.85rem;color:#64748b;margin-bottom:28px}
    label{display:block;font-size:0.8rem;font-weight:600;color:#475569;margin-bottom:5px}
    input{width:100%;padding:12px 14px;border:1px solid #e2e8f0;border-radius:10px;font-size:0.9rem;font-family:'Poppins',sans-serif;outline:none;transition:border-color .2s;margin-bottom:18px}
    input:focus{border-color:#0f766e;box-shadow:0 0 0 3px rgba(15,118,110,.1)}
    .btn{width:100%;padding:14px;border-radius:12px;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;border:none;font-size:1rem;font-weight:700;cursor:pointer;font-family:'Poppins',sans-serif;transition:all .2s}
    .btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(15,118,110,.35)}
    .btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .err{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:12px 16px;border-radius:10px;font-size:0.85rem;margin-bottom:18px;display:none}
    .back{text-align:center;margin-top:20px;font-size:0.83rem;color:#64748b}
    .back a{color:#0f766e;text-decoration:none;font-weight:600}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🌍</div>
    <span class="logo-text">Travel<span>Sphere</span></span>
  </div>
  <h2>Admin Portal</h2>
  <p class="sub">Sign in to manage the platform</p>
  <div class="err" id="err"></div>
  <form id="loginForm">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="admin@travelsphere.in" required/>
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" required/>
    <button type="submit" class="btn" id="btn">Sign In</button>
  </form>
  <p class="back"><a href="/">← Back to TravelSphere</a></p>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const res  = await fetch('/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    if (data.role !== 'admin') throw new Error('Not an admin account');
    localStorage.setItem('ts_token', data.token);
    localStorage.setItem('ts_role',  data.role);
    window.location.href = '/admin/dashboard.html';
  } catch(ex) {
    err.textContent = ex.message; err.style.display = 'block';
  } finally { btn.disabled = false; btn.textContent = 'Sign In'; }
});
</script>
</body>
</html>
