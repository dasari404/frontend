<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Guide Login — TravelSphere</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#0f172a,#3b1f6e,#0f766e);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:#fff;border-radius:24px;padding:48px 40px;width:100%;max-width:440px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
    .logo{display:flex;align-items:center;gap:10px;margin-bottom:8px;justify-content:center}
    .logo-icon{width:44px;height:44px;background:linear-gradient(135deg,#f59e0b,#0f766e);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px}
    .logo-text{font-size:1.3rem;font-weight:800;color:#0f172a}.logo-text span{color:#f59e0b}
    .portal-tag{text-align:center;font-size:.75rem;font-weight:700;color:#f59e0b;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);padding:4px 14px;border-radius:20px;display:inline-block;margin-bottom:24px}
    .wrap-center{text-align:center}
    h2{font-size:1.4rem;font-weight:800;color:#0f172a;margin-bottom:4px;text-align:center}
    .sub{font-size:.85rem;color:#64748b;margin-bottom:28px;text-align:center}
    label{display:block;font-size:.8rem;font-weight:600;color:#475569;margin-bottom:5px}
    input{width:100%;padding:12px 14px;border:1px solid #e2e8f0;border-radius:10px;font-size:.9rem;font-family:'Poppins',sans-serif;outline:none;transition:border-color .2s;color:#0f172a}
    input:focus{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.1)}
    .form-group{margin-bottom:18px}
    .btn{width:100%;padding:14px;border-radius:12px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#0f172a;border:none;font-size:1rem;font-weight:700;cursor:pointer;font-family:'Poppins',sans-serif;transition:all .2s;margin-top:4px}
    .btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(245,158,11,.4)}
    .btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .err{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:12px 16px;border-radius:10px;font-size:.85rem;margin-bottom:18px;display:none}
    .links{display:flex;justify-content:space-between;font-size:.83rem;margin-top:20px}
    .links a{color:#f59e0b;text-decoration:none;font-weight:600}
    .back{text-align:center;margin-top:16px;font-size:.83rem;color:#64748b}
    .back a{color:#0f766e;text-decoration:none;font-weight:600}
  </style>
</head>
<body>
<div class="card">
  <div class="logo"><div class="logo-icon">🧭</div><span class="logo-text">Travel<span>Sphere</span></span></div>
  <div class="wrap-center"><span class="portal-tag">Guide Portal</span></div>
  <h2>Guide Sign In</h2>
  <p class="sub">Access your guide dashboard</p>
  <div class="err" id="err"></div>
  <form id="loginForm">
    <div class="form-group"><label>Email Address</label><input type="email" id="email" placeholder="guide@example.com" required/></div>
    <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="••••••••" required/></div>
    <button type="submit" class="btn" id="btn"><i class="fas fa-sign-in-alt"></i> Sign In</button>
  </form>
  <div class="links">
    <a href="/guide/register.html">Register as guide →</a>
  </div>
  <div class="back"><a href="/">← Back to TravelSphere</a></div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  err.style.display = 'none';
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in…';
  try {
    const res  = await fetch('/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    if (data.role !== 'guide') throw new Error('Not a guide account');
    localStorage.setItem('ts_token', data.token);
    localStorage.setItem('ts_role', data.role);
    localStorage.setItem('ts_portal_token', data.portalToken || '');
    if (!data.onboardingComplete) {
      window.location.href = '/guide/onboarding.html';
    } else {
      window.location.href = '/guide/dashboard.html';
    }
  } catch(ex) {
    err.textContent = ex.message; err.style.display = 'block';
  } finally { btn.disabled = false; btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In'; }
});
</script>
</body>
</html>
